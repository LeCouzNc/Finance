<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finance">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E1116">
<title>Finance</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230E1116'/%3E%3Ccircle cx='90' cy='90' r='62' fill='none' stroke='%23C9A227' stroke-width='4'/%3E%3Ccircle cx='90' cy='90' r='46' fill='none' stroke='%23C9A227' stroke-width='2' opacity='0.55'/%3E%3Cline x1='90' y1='90' x2='90' y2='44' stroke='%23EDEDE3' stroke-width='5' stroke-linecap='round'/%3E%3Cline x1='90' y1='90' x2='124' y2='104' stroke='%23C9A227' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='90' cy='90' r='6' fill='%23EDEDE3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1116;
    --panel:#171B23;
    --panel-2:#1E2430;
    --hairline:#2A3140;
    --gold:#C9A227;
    --gold-soft:rgba(201,162,39,0.16);
    --ink:#EDEDE3;
    --ink-muted:#8A8F9C;
    --good:#4FA490;
    --bad:#C1665A;
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;}
  body{padding-bottom:56px;}
  .numeric{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  .display{font-family:'Fraunces',serif;}

  header.top{position:sticky; top:0; z-index:20; background:linear-gradient(180deg, var(--bg) 70%, rgba(14,17,22,0));
    padding:calc(env(safe-area-inset-top) + 14px) 0 6px;}
  .month-scroller{display:flex; gap:8px; overflow-x:auto; padding:0 16px 10px; scrollbar-width:none;}
  .month-scroller::-webkit-scrollbar{display:none;}
  .month-pill{flex:0 0 auto; padding:7px 14px; border-radius:100px; font-size:13px; font-weight:500;
    color:var(--ink-muted); background:var(--panel); border:1px solid var(--hairline); white-space:nowrap;}
  .month-pill.active{color:#0E1116; background:var(--gold); border-color:var(--gold); font-weight:600;}

  main{padding:4px 16px 24px;}

  .hero{background:radial-gradient(120% 140% at 20% -10%, #1c2230 0%, var(--panel) 60%);
    border:1px solid var(--hairline); border-radius:24px; padding:22px 20px 18px; margin-top:8px;}
  .hero-label{font-size:12px; letter-spacing:.02em; color:var(--ink-muted); margin:0 0 4px;}
  .hero-month{font-size:15px; color:var(--gold); margin:0 0 14px; font-weight:500;}
  .hero-amount{font-size:40px; line-height:1; margin:0; font-weight:600; letter-spacing:-0.01em;}
  .hero-sub{font-size:12.5px; color:var(--ink-muted); margin-top:8px;}

  .checklist{display:flex; gap:8px; margin-top:18px; flex-wrap:wrap;}
  .chip{display:flex; align-items:center; gap:6px; padding:7px 10px 7px 8px; border-radius:100px;
    background:var(--panel-2); border:1px solid var(--hairline); font-size:12px; color:var(--ink-muted);}
  .chip .dot{width:8px; height:8px; border-radius:50%; background:var(--hairline);}
  .chip.on{color:var(--ink); border-color:rgba(79,164,144,0.4); background:rgba(79,164,144,0.08);}
  .chip.on .dot{background:var(--good);}

  h2.section-title{font-size:13px; text-transform:none; color:var(--ink-muted); font-weight:600;
    margin:28px 2px 10px; display:flex; justify-content:space-between; align-items:baseline;}
  h2.section-title span.small{font-size:11.5px; color:var(--ink-muted); font-weight:400;}

  .cf-row{padding:12px 4px; border-bottom:1px solid var(--hairline);}
  .cf-row:last-child{border-bottom:none;}
  .cf-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .cf-name{font-size:14.5px; font-weight:500;}
  .cf-nums{font-size:13.5px;}
  .cf-nums .actual{font-weight:600;}
  .cf-nums .sep{color:var(--ink-muted); margin:0 3px;}
  .cf-nums .budget{color:var(--ink-muted);}
  .bar{height:6px; border-radius:100px; background:var(--panel-2); overflow:hidden;}
  .bar > i{display:block; height:100%; background:var(--gold); border-radius:100px;}
  .bar > i.over{background:var(--bad);}
  .cf-row.total .cf-name{font-weight:600; color:var(--gold);}
  .cf-row.total .actual{color:var(--gold); font-size:15px;}

  .tracker{background:var(--panel); border:1px solid var(--hairline); border-radius:16px; margin-bottom:10px; overflow:hidden;}
  .tracker-head{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; cursor:pointer;}
  .tracker-head h3{margin:0; font-size:14.5px; font-weight:600;}
  .tracker-head .meta{font-size:12.5px; color:var(--ink-muted); margin-top:2px;}
  .chev{width:9px; height:9px; border-right:1.6px solid var(--ink-muted); border-bottom:1.6px solid var(--ink-muted);
    transform:rotate(45deg); transition:transform .2s ease; margin-right:4px;}
  .tracker.open .chev{transform:rotate(-135deg);}
  .tracker-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .tracker.open .tracker-body{max-height:1200px;}
  .item{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 16px;
    border-top:1px solid var(--hairline);}
  .item-main{flex:1; min-width:0;}
  .item-name{font-size:13.5px;}
  .item-bar{margin-top:6px;}
  .item-nums{display:flex; align-items:center; gap:4px; font-size:12.5px; white-space:nowrap;}
  .item-nums input{width:74px; background:var(--panel-2); border:1px solid var(--hairline); color:var(--ink);
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; border-radius:8px; padding:5px 6px; text-align:right;}
  .item-nums input:focus{outline:none; border-color:var(--gold);}
  .item-nums .of{color:var(--ink-muted);}

  footer.note{font-size:11.5px; color:var(--ink-muted); text-align:center; margin:26px 10px 0; line-height:1.5;}
  .year-scroller{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
  .year-scroller::-webkit-scrollbar{display:none}
  .auto{font-size:10px;color:var(--gold);border:1px solid var(--gold);border-radius:100px;padding:1px 7px;margin-left:6px;letter-spacing:.04em;vertical-align:middle}
  .item input:disabled{opacity:.55}
  [hidden]{display:none!important}
  body{padding-bottom:calc(56px + env(safe-area-inset-bottom));}
  .btn{background:var(--panel-2);border:1px solid var(--hairline);color:var(--ink);border-radius:100px;padding:7px 14px;font:500 13px Inter,sans-serif;cursor:pointer}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#0E1116;font-weight:600}
  .btn.bad{color:var(--bad)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .add{display:block;width:calc(100% - 32px);margin:10px 16px 14px;border-style:dashed;color:var(--gold)}
  .edit .item{cursor:pointer}
  .edit .item-name::after{content:' ✎';color:var(--gold);font-size:11px}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:50}
  .sheet-bg.on{display:flex}
  .sheet{width:100%;background:var(--panel);border-radius:22px 22px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:88%;overflow:auto}
  .sheet h3{margin:0 0 14px;font-size:16px;font-weight:600}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:12px;color:var(--ink-muted);margin-bottom:5px}
  .fld input,.fld select,.fld textarea{width:100%;background:var(--panel-2);border:1px solid var(--hairline);color:var(--ink);border-radius:10px;padding:11px;font-size:16px;font-family:inherit}
  .fld.chk{display:flex;align-items:center;gap:10px}
  .fld.chk input{width:auto}
  .fld.chk label{margin:0;font-size:13px;color:var(--ink)}
  .row{display:flex;gap:8px;margin-top:6px}
  .row .btn{flex:1;padding:12px}
</style>
</head>
<body>
<header class="top"><div class="year-scroller" id="yearScroller"></div><div class="month-scroller" id="monthScroller"></div></header>
<main>
  <section class="hero">
    <p class="hero-label">Reste à dépenser</p>
    <p class="hero-month display" id="heroMonth">—</p>
    <p class="hero-amount numeric" id="heroAmount">—</p>
    <p class="hero-sub" id="heroSub"></p>
    <div class="checklist" id="checklist"></div>
  </section>
  <h2 class="section-title">Vue d'ensemble <span class="small">budget · réel</span></h2>
  <section id="cashflowList"></section>
  <h2 class="section-title" style="margin-top:32px;">Détail par catégorie <button class="btn" id="editBtn">Modifier</button></h2>
  <div id="trackers"></div>
  <div class="toolbar" id="editTools" hidden>
    <button class="btn" id="addCat">+ Catégorie</button>
    <button class="btn" id="startBtn">Solde de départ</button>
    <button class="btn" id="backupBtn">Sauvegarde</button>
  </div>
  <footer class="note">Les modifications restent sur cet appareil · exporte une sauvegarde de temps en temps</footer>
</main>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<script>
const SEED={"cats":[{"id":"income","label":"Revenus","kind":"in"},{"id":"expense","label":"Dépenses","kind":"out"},{"id":"bill","label":"Factures","kind":"out"},{"id":"debt","label":"Dettes","kind":"out"},{"id":"savings","label":"Épargne","kind":"out"},{"id":"investment","label":"Investissements","kind":"out"}],"items":[],"months":{},"ver":3};
const MONTHS=[["JAN","Janv."],["FEV","Fév."],["MAR","Mars"],["AVR","Avril"],["MAI","Mai"],["JUN","Juin"],["JUI","Juil."],["AOU","Août"],["SEP","Sept."],["OCT","Oct."],["NOV","Nov."],["DEC","Déc."]];
const CODES=MONTHS.map(m=>m[0]), KEY='finance_v2';
let S=null; try{S=JSON.parse(localStorage.getItem(KEY));}catch(e){}
if(!S||!S.cats) S=JSON.parse(JSON.stringify(SEED));
function migrate(){const o={};Object.keys(S.months).forEach(k=>{o[/^[A-Z]{3}$/.test(k)?'2026-'+k:k]=S.months[k]});S.months=o;
  if((S.ver||0)<3){const ex=S.items.find(i=>i.cat==='expense');
    if(S.cats.some(c=>c.id==='expense')&&!S.items.some(i=>i.cat==='expense'&&i.name==='Revolut'))S.items.splice(ex?S.items.indexOf(ex):S.items.length,0,{id:'revolut',cat:'expense',name:'Revolut'});
    S.ver=3}
  if(S.ver<4){S.cats.forEach(c=>{if(['bill','debt','investment'].includes(c.id))c.pre=true});
    Object.keys(S.months).forEach(k=>{if(+k.slice(0,4)>=2027){const m=S.months[k];Object.keys(m.v).forEach(id=>{const it=S.items.find(i=>i.id===id),c=it&&S.cats.find(x=>x.id===it.cat);if(c&&c.pre&&!m.v[id][1])m.v[id][1]=m.v[id][0]})}});S.ver=4}
  if(S.ver<5){S.items.forEach(it=>{const c=S.cats.find(x=>x.id===it.cat);if(c&&c.pre&&it.auto===undefined){const vs=Object.keys(S.months).map(k=>S.months[k].v[it.id]).filter(v=>v&&v[0]>0);it.auto=vs.length>0&&vs.every(v=>v[1]===v[0])}});S.ver=5}}
migrate();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const FULL=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const YEARS=[];for(let y=2026;y<=2035;y++)YEARS.push(y);
const nowKey=()=>{const d=new Date();return Math.min(2035,Math.max(2026,d.getFullYear()))+'-'+CODES[d.getMonth()]};
const ord=k=>+k.slice(0,4)*12+CODES.indexOf(k.slice(5));
let active=nowKey(), edit=false, lastDay=new Date().toDateString();
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const fmt=n=>Math.round(n||0).toLocaleString('fr-FR').replace(/\u202f/g,' ')+' F';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mo(k){let m=S.months[k];
  if(!m){const o=ord(k),ks=Object.keys(S.months).filter(x=>ord(x)<o).sort((a,b)=>ord(a)-ord(b)),p=ks.length?S.months[ks.pop()]:null;
    m={start:0,checks:{},v:{}};if(p)Object.keys(p.v).forEach(id=>{const it=S.items.find(i=>i.id===id),c=it&&S.cats.find(x=>x.id===it.cat),b=p.v[id][0];m.v[id]=[b,c&&c.pre?b:0]});S.months[k]=m}
  m.title=FULL[CODES.indexOf(k.slice(5))]+' '+k.slice(0,4);return m}
const val=(m,id)=>{const v=mo(m).v[id]||[0,0],it=S.items.find(i=>i.id===id);return it&&it.auto?[v[0],v[0]]:v};
const catItems=c=>S.items.filter(i=>i.cat===c.id);
function sums(m,c){let b=0,a=0;catItems(c).forEach(i=>{const v=val(m,i.id);b+=v[0];a+=v[1]});return{b,a}}
function totals(m){let b=mo(m).start||0,a=b;S.cats.forEach(c=>{const s=sums(m,c),k=c.kind==='in'?1:-1;b+=k*s.b;a+=k*s.a});return{b,a}}
function setVal(id,i,x,fwd){const o=ord(active);mo(active);Object.keys(S.months).filter(k=>k===active||(fwd&&ord(k)>o)).forEach(k=>{const m=mo(k);m.v[id]=m.v[id]||[0,0];m.v[id][i]=x})}

function sheet(title,fields,onSave,extra,okLabel){
  const sh=$('sheet'),bg=$('sheetBg');
  sh.innerHTML=`<h3>${esc(title)}</h3>`+fields.map((f,i)=>{
    if(f.t==='check')return `<div class="fld chk"><input type="checkbox" id="f${i}" ${f.v?'checked':''}><label for="f${i}">${f.l}</label></div>`;
    if(f.t==='select')return `<div class="fld"><label>${f.l}</label><select id="f${i}">${f.o.map(([k,l])=>`<option value="${k}" ${k===f.v?'selected':''}>${l}</option>`).join('')}</select></div>`;
    if(f.t==='area')return `<div class="fld"><label>${f.l}</label><textarea id="f${i}" rows="8">${esc(f.v||'')}</textarea></div>`;
    const n=f.t==='num';
    return `<div class="fld"><label>${f.l}</label><input id="f${i}" type="${n?'number':'text'}" ${n?'inputmode="decimal"':''} value="${esc(f.v??'')}"></div>`}).join('')
    +`<div class="row"><button class="btn" id="sCancel">Annuler</button>${extra?`<button class="btn bad" id="sExtra">${extra.l}</button>`:''}${onSave?`<button class="btn gold" id="sOk">${okLabel||'OK'}</button>`:''}</div>`;
  const close=()=>bg.classList.remove('on');
  bg.classList.add('on');
  sh.querySelector('#sCancel').onclick=close;
  if(extra)sh.querySelector('#sExtra').onclick=()=>{close();extra.f()};
  if(onSave)sh.querySelector('#sOk').onclick=()=>{
    const r=fields.map((f,i)=>{const e=sh.querySelector('#f'+i);return f.t==='check'?e.checked:f.t==='num'?(parseFloat(e.value)||0):e.value});
    close();onSave(r)};
}
$('sheetBg').onclick=e=>{if(e.target.id==='sheetBg')e.target.classList.remove('on')};
const confirmDel=(msg,f)=>sheet(msg,[],null,{l:'Supprimer',f});

function delItem(id){S.items=S.items.filter(i=>i.id!==id);Object.keys(S.months).forEach(k=>delete S.months[k].v[id]);save();render()}
function delCat(cid){S.items.filter(i=>i.cat===cid).forEach(i=>Object.keys(S.months).forEach(k=>delete S.months[k].v[i.id]));
  S.items=S.items.filter(i=>i.cat!==cid);S.cats=S.cats.filter(c=>c.id!==cid);save();render()}

function editItem(it){
  sheet('Modifier le poste',[{l:'Nom',t:'text',v:it.name},{l:'Budget · '+mo(active).title,t:'num',v:val(active,it.id)[0]},{l:'Appliquer ce budget aux mois suivants',t:'check',v:true},{l:'Automatique : le réel suit le budget (rien à saisir)',t:'check',v:!!it.auto}],
    ([n,b,fw,au])=>{it.name=n.trim()||it.name;
      if(it.auto&&!au)Object.keys(S.months).forEach(k=>{const v=S.months[k].v[it.id];if(v)v[1]=v[0]});
      it.auto=au;setVal(it.id,0,b,fw);save();render()},
    {l:'Supprimer',f:()=>confirmDel('Supprimer « '+it.name+' » de tous les mois ?',()=>delItem(it.id))});
}
function addItem(c){
  sheet('Nouveau poste · '+c.label,[{l:'Nom',t:'text',v:''},{l:'Budget',t:'num',v:''},{l:'Même budget les mois suivants',t:'check',v:true},{l:'Automatique : le réel suit le budget (rien à saisir)',t:'check',v:!!c.pre}],
    ([n,b,fw,au])=>{if(!n.trim())return;const id=uid();S.items.push({id,cat:c.id,name:n.trim(),auto:au});setVal(id,0,b,fw);save();render()},null,'Ajouter');
}
function editCat(c){
  sheet('Modifier la catégorie',[{l:'Nom',t:'text',v:c.label}],([n])=>{c.label=n.trim()||c.label;save();render()},
    {l:'Supprimer',f:()=>confirmDel('Supprimer « '+c.label+' » et ses postes ?',()=>delCat(c.id))});
}
$('addCat').onclick=()=>sheet('Nouvelle catégorie',[{l:'Nom',t:'text',v:''},{l:'Type',t:'select',v:'out',o:[['out','Sortie d\'argent'],['in','Entrée d\'argent']]}],
  ([n,k])=>{if(!n.trim())return;const id=uid();S.cats.push({id,label:n.trim(),kind:k});save();render()},null,'Ajouter');
$('startBtn').onclick=()=>sheet('Solde de départ · '+mo(active).title,[{l:'Montant (F)',t:'num',v:mo(active).start||0}],([n])=>{mo(active).start=n;save();render()});
$('backupBtn').onclick=()=>sheet('Sauvegarde',[{l:'Copie ce texte pour sauvegarder, ou colle une sauvegarde pour restaurer',t:'area',v:JSON.stringify(S)}],
  ([t])=>{try{const n=JSON.parse(t);if(!n.cats||!n.months)throw 0;S=n;migrate();save();render()}catch(e){sheet('Sauvegarde invalide',[],null)}},null,'Restaurer');
$('editBtn').onclick=()=>{edit=!edit;$('editBtn').textContent=edit?'Terminer':'Modifier';$('editBtn').classList.toggle('gold',edit);render()};

function pills(){
  const ys=$('yearScroller'),sc=$('monthScroller');
  if(!sc.children.length){
    YEARS.forEach(y=>{const p=document.createElement('div');p.className='month-pill';p.dataset.y=y;p.textContent=y;p.onclick=()=>{active=y+'-'+active.slice(5);render()};ys.appendChild(p)});
    MONTHS.forEach(([c,l])=>{const p=document.createElement('div');p.className='month-pill';p.dataset.c=c;p.textContent=l;p.onclick=()=>{active=active.slice(0,4)+'-'+c;render()};sc.appendChild(p)});}
  document.querySelectorAll('[data-y]').forEach(p=>p.classList.toggle('active',p.dataset.y===active.slice(0,4)));
  document.querySelectorAll('[data-c]').forEach(p=>p.classList.toggle('active',p.dataset.c===active.slice(5)));
  document.querySelectorAll('.month-pill.active').forEach(p=>p.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}));
}
function cfRow(name,v,tot){
  const r=document.createElement('div');r.className='cf-row'+(tot?' total':'');
  const pct=v.budget>0?Math.min(1,Math.abs(v.actual)/Math.abs(v.budget)):(v.actual!==0?1:0), over=v.budget>0&&v.actual>v.budget;
  r.innerHTML=`<div class="cf-top"><span class="cf-name">${esc(name)}</span><span class="cf-nums numeric"><span class="actual">${fmt(v.actual)}</span><span class="sep">/</span><span class="budget">${fmt(v.budget)}</span></span></div><div class="bar"><i style="width:${(pct*100).toFixed(0)}%" class="${over?'over':''}"></i></div>`;
  return r;
}
function itemRow(c,it){
  const [b,a]=val(active,it.id), r=document.createElement('div');r.className='item';
  const pct=b>0?Math.min(1,a/b):(a>0?1:0), over=b>0&&a>b;
  r.innerHTML=`<div class="item-main"><div class="item-name">${esc(it.name)}${it.auto?'<span class="auto">auto</span>':''}</div><div class="bar item-bar"><i style="width:${(pct*100).toFixed(0)}%" class="${over?'over':''}"></i></div></div><div class="item-nums numeric"><input type="number" inputmode="decimal" value="${Math.round(a)}" ${it.auto?'disabled':''}><span class="of">/ ${fmt(b)}</span></div>`;
  const inp=r.querySelector('input');
  inp.onclick=e=>e.stopPropagation();
  inp.onchange=()=>{setVal(it.id,1,parseFloat(inp.value)||0,false);save();render()};
  r.onclick=()=>{if(edit)editItem(it)};
  return r;
}
function render(){
  document.body.classList.toggle('edit',edit);$('editTools').hidden=!edit;
  pills();
  const m=mo(active),t=totals(active);
  $('heroMonth').textContent=m.title;$('heroAmount').textContent=fmt(t.a);$('heroSub').textContent='Budget prévu : '+fmt(t.b)+' restant';
  const cl=$('checklist');cl.innerHTML='';
  S.cats.forEach(c=>{const d=document.createElement('div');d.className='chip'+(m.checks[c.id]?' on':'');d.innerHTML=`<span class="dot"></span>${esc(c.label)}`;
    d.onclick=()=>{m.checks[c.id]=m.checks[c.id]?0:1;save();render()};cl.appendChild(d)});
  const cf=$('cashflowList');cf.innerHTML='';
  S.cats.forEach(c=>{const s=sums(active,c);cf.appendChild(cfRow(c.label,{budget:s.b,actual:s.a}))});
  cf.appendChild(cfRow('Solde du mois',{budget:t.b,actual:t.a},true));
  const tr=$('trackers'),open={};
  tr.querySelectorAll('.tracker').forEach(x=>open[x.dataset.k]=x.classList.contains('open'));tr.innerHTML='';
  S.cats.forEach(c=>{
    const its=catItems(c),s=sums(active,c),w=document.createElement('div');
    w.className='tracker'+(open[c.id]?' open':'');w.dataset.k=c.id;
    const h=document.createElement('div');h.className='tracker-head';
    h.innerHTML=`<div><h3>${esc(c.label)}</h3><div class="meta">${its.length} poste${its.length>1?'s':''} · ${fmt(s.a)} / ${fmt(s.b)}</div></div>${edit?'<button class="btn">Éditer</button>':'<div class="chev"></div>'}`;
    h.onclick=()=>w.classList.toggle('open');
    if(edit)h.querySelector('button').onclick=e=>{e.stopPropagation();editCat(c)};
    w.appendChild(h);
    const b=document.createElement('div');b.className='tracker-body';
    its.forEach(it=>b.appendChild(itemRow(c,it)));
    if(edit){const a=document.createElement('button');a.className='btn add';a.textContent='+ Ajouter un poste';a.onclick=()=>addItem(c);b.appendChild(a)}
    w.appendChild(b);tr.appendChild(w);
    if(edit)w.classList.add('open');
  });
}
save();render();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&lastDay!==new Date().toDateString()){lastDay=new Date().toDateString();active=nowKey();render()}});
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});}
</script>
